spring.application.name=nfc-api

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID:424984163476-c49eb588d7pu56g5bs5ldaechkhdqneh.apps.googleusercontent.com}
google.client.secret=${GOOGLE_CLIENT_SECRET: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}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${google.client.id}
spring.security.oauth2.client.registration.google.client-secret=${google.client.secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/drive
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# JWT Configuration
jwt.secret=${JWT_SECRET:nfc-api-secret-key-2024-very-long-and-secure}
jwt.expiration=3600000

# Server Configuration
server.port=8080

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Logging
logging.level.com.salcatech.nfc_api=DEBUG
logging.level.org.springframework.security=DEBUG
